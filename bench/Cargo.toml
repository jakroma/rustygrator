[package]
name = "rustygrator-bench"
version = "0.1.0"
edition = "2021"
description = "End-to-end benchmarks of rustygrator (PERF-2..PERF-8)"

[dependencies]
rustygrator-core = { path = "../core" }
tokio = { version = "1.35.1", features = ["full"] }
tokio-postgres = "0.7.10"
mongodb = "2.8.0"
rusqlite = { version = "0.31", features = ["bundled"] }
scylla = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4.18", features = ["derive"] }
url = "2.5.0"
futures-util = "0.3"

[[bin]]
name = "rustygrator-bench"
path = "src/main.rs"
