# End-to-end test of rustygrator against every supported database.
#
#   docker compose -f e2e/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f e2e/docker-compose.test.yml down -v
#
# PostgreSQL runs with logical replication enabled (live transfer, LIVE-2), MongoDB as a
# single-node replica set (change streams, LIVE-1), ScyllaDB as a single node (CDC, LIVE-15),
# MySQL with the row-based binlog (LIVE-16), Oracle Free in ARCHIVELOG mode with supplemental
# logging (LogMiner, LIVE-19); SQLite files are created by the tests.
name: rustygrator-e2e

services:
  postgres:
    image: postgres:16.4
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=20", "-c", "max_wal_senders=20"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7.0.14
    command: ["--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    healthcheck:
      # initiates the replica set on the first run, healthy once this node is primary
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  scylla:
    image: scylladb/scylla:6.2.0
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1", "--api-address", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s

  mysql:
    image: mysql:8.4.3
    # binlog is on by default in 8.x; ROW format and FULL row images are the defaults too, set
    # explicitly because live mode depends on them
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--local-infile=0"]
    environment:
      MYSQL_ROOT_PASSWORD: password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  oracle:
    image: gvenzl/oracle-free:23.5-slim-faststart
    environment:
      ORACLE_PASSWORD: password
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  tests:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.tests
    environment:
      DM_TEST_PG_URL: postgresql://user:password@postgres:5432/test
      DM_TEST_MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      DM_TEST_SCYLLA_URL: scylla://scylla:9042/
      DM_TEST_MYSQL_URL: mysql://root:password@mysql:3306/
      DM_TEST_ORACLE_URL: oracle://system:password@oracle:1521/FREEPDB1
      RUST_LOG: warn
      RUST_BACKTRACE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      scylla:
        condition: service_healthy
      mysql:
        condition: service_healthy
      oracle:
        condition: service_healthy
